<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>GPGPU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
    }

    .credits {
          position: fixed;
    left: 10px;
    bottom: 10px;
    background-color: #ffffff63;
    border-radius: 15px;
    padding: 15px 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    font-size: 16px;
    }
    .loader{
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
    }
  </style>
  <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
  <div class="credits">
    <h6>Model Credits</h6>
    <p><a
        href="https://sketchfab.com/3d-models/black-panther-marvel-rivals-animated-c13410385dfc47f3abe2826b362c8f6c" target="_blank">Black
        Panther</a> Model by King_45</p>
    <p><a href="https://sketchfab.com/3d-models/thanos-textured-rigged-ab47ab620d09404caf2dec9efdfee52d" target="_blank">Thanos</a>
      Model by 3D MODELS</p>
  </div>
  <div class="loader">
    <svg version="1.1" id="L2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 100 100" enable-background="new 0 0 100 100" xml:space="preserve">
<circle fill="none" stroke="#fff" stroke-width="4" stroke-miterlimit="10" cx="50" cy="50" r="48"></circle>
<line fill="none" stroke-linecap="round" stroke="#fff" stroke-width="4" stroke-miterlimit="10" x1="50" y1="50" x2="85" y2="50.5">
  <animateTransform attributeName="transform" dur="2s" type="rotate" from="0 50 50" to="360 50 50" repeatCount="indefinite"></animateTransform>
</line>
<line fill="none" stroke-linecap="round" stroke="#fff" stroke-width="4" stroke-miterlimit="10" x1="50" y1="50" x2="49.5" y2="74">
  <animateTransform attributeName="transform" dur="15s" type="rotate" from="0 50 50" to="360 50 50" repeatCount="indefinite"></animateTransform>
</line>
</svg>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
